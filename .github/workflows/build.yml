name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Core UI SDK
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'third_party\core-ui-v1.8.0'
          $sdk = Join-Path $PWD 'third_party\core-ui-sdk-v1.8.0'
          $build = Join-Path $env:RUNNER_TEMP 'core-ui-build'
          git clone --depth 1 --branch codex/align-v1.8 `
            https://github.com/cdd1037/core-ui.git $source
          cmake -S $source -B $build -G 'Visual Studio 17 2022' -A x64 `
            -DUI_CORE_BUILD_STATIC_ARCHIVE=ON
          cmake --build $build --config Release --target release-package --parallel
          Move-Item -LiteralPath (Join-Path $source 'release\core-ui-v1.8.0') -Destination $sdk
          "CORE_UI_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        shell: pwsh
        run: ./test.ps1 -Configuration Release

      - name: Build and package
        shell: pwsh
        run: ./package.ps1 -CoreUiRoot $env:CORE_UI_ROOT

      - name: Upload player package
        uses: actions/upload-artifact@v7
        with:
          name: San9Toolkit-windows
          path: |
            dist/San9Toolkit-v*-windows.zip
            dist/San9Toolkit-v*-windows.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "标签 $env:GITHUB_REF_NAME 与 VERSION $version 不一致。"
          }
          gh release create $env:GITHUB_REF_NAME `
            "dist/San9Toolkit-v$version-windows.zip#San9 Toolkit $expectedTag Windows 玩家版" `
            "dist/San9Toolkit-v$version-windows.zip.sha256#SHA-256 校验文件" `
            --title "San9 Toolkit $expectedTag" `
            --generate-notes `
            --verify-tag `
            --latest
