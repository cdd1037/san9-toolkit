name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Core UI 1.8 with static CRT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'core-ui-src'
          $build = Join-Path $env:RUNNER_TEMP 'core-ui-build'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'core-ui-sdk\core-ui-v1.8.0'

          git clone --depth 1 --branch codex/align-v1.8 https://github.com/cdd1037/core-ui.git $source
          cmake -S $source -B $build -A x64 `
            -DUI_CORE_MSVC_STATIC_CRT=ON `
            -DUI_CORE_BUILD_STATIC_ARCHIVE=OFF `
            -DUI_CORE_BUILD_INTERNAL_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Core UI configure failed.' }

          cmake --build $build --config Release --target core-ui --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Core UI build failed.' }

          $includeDir = Join-Path $sdkRoot 'include'
          $libDir = Join-Path $sdkRoot 'lib\dynamic'
          New-Item -ItemType Directory -Force -Path $includeDir, $libDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $source 'include\ui_core.h') -Destination $includeDir
          Copy-Item -LiteralPath (Join-Path $build 'Release\core-ui.dll') -Destination $libDir
          Copy-Item -LiteralPath (Join-Path $build 'Release\core-ui.lib') -Destination $libDir
          "CORE_UI_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        shell: pwsh
        run: ./test.ps1 -Configuration Release

      - name: Build and package
        shell: pwsh
        run: ./package.ps1 -CoreUiRoot $env:CORE_UI_ROOT

      - name: Verify packaged binaries do not import MSVC runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found.' }
          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin.exe not found.' }

          $binaries = @(
            'dist\Release\San9Toolkit.exe',
            'dist\Release\bin\x64\core-ui.dll',
            'dist\Release\bin\x86\San9Toolkit.Bootstrap.exe',
            'dist\Release\bin\x86\San9Toolkit.Runtime.dll'
          )
          $forbidden = 'MSVCP140(?:_[0-9]+)?\.dll|VCRUNTIME140(?:_[0-9]+)?\.dll|CONCRT140\.dll'
          foreach ($binary in $binaries) {
            $deps = (& $dumpbin /dependents $binary 2>&1) -join "`n"
            Write-Host "=== $binary ==="
            Write-Host $deps
            if ($deps -match $forbidden) {
              throw "$binary still imports a dynamic MSVC runtime DLL."
            }
          }

      - name: Upload player package
        uses: actions/upload-artifact@v7
        with:
          name: San9Toolkit-windows-static-crt
          path: |
            dist/San9Toolkit-v*-windows.zip
            dist/San9Toolkit-v*-windows.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "标签 $env:GITHUB_REF_NAME 与 VERSION $version 不一致。"
          }
          gh release create $env:GITHUB_REF_NAME `
            "dist/San9Toolkit-v$version-windows.zip#San9 Toolkit $expectedTag Windows 玩家版" `
            "dist/San9Toolkit-v$version-windows.zip.sha256#SHA-256 校验文件" `
            --title "San9 Toolkit $expectedTag" `
            --generate-notes `
            --verify-tag `
            --latest
